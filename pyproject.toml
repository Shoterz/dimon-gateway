[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dimon-gateway"
version = "0.1.0"
description = "Conversational banking research demo with deterministic execution boundaries"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<0.137",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn[standard]>=0.46,<0.47",
    "websockets>=16,<17",
]

[project.scripts]
dimon-serve = "apps.dimon_live.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
testpaths = ["apps/dimon_live/tests", "tests"]

[tool.uv]
default-groups = ["dev"]
